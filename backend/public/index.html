<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoCart Admin — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --accent: #6366f1;
    --green: #10b981;
    --danger: #ef4444;
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* animated gradient orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    pointer-events: none;
    animation: float 8s ease-in-out infinite alternate;
  }
  .orb1 { width: 500px; height: 500px; background: #4f46e5; top: -150px; left: -150px; animation-delay: 0s; }
  .orb2 { width: 400px; height: 400px; background: #10b981; bottom: -120px; right: -120px; animation-delay: 2s; }
  .orb3 { width: 300px; height: 300px; background: #f59e0b; top: 50%; left: 50%; animation-delay: 4s; }

  @keyframes float {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, -30px) scale(1.08); }
  }

  .card {
    position: relative;
    z-index: 10;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 44px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    animation: slideUp 0.5s ease both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-area {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 14px;
    box-shadow: 0 8px 20px rgba(79,70,229,0.4);
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
  }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .btn:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 18px;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .alert.error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; display: flex; }
  .alert.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; display: flex; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.2);
    color: #6ee7b7;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 24px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="card">
  <div class="logo-area">
    <div class="logo-icon">🛒</div>
    <h1>GoCart Admin</h1>
    <p class="subtitle">Sign in to access your admin panel</p>
  </div>

  <div id="alert" class="alert"></div>

  <form id="loginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="admin@example.com" required autocomplete="email" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn" id="loginBtn">
      Sign In to Admin
    </button>
  </form>

  <div style="text-align:center">
    <span class="badge">🔒 Secure Admin Access · GoCart</span>
  </div>
</div>

<script>
  // If already logged in, redirect to dashboard
  if (localStorage.getItem('adminToken')) {
    window.location.href = '/dashboard';
  }

  const form    = document.getElementById('loginForm');
  const btn     = document.getElementById('loginBtn');
  const alertEl = document.getElementById('alert');

  function showAlert(msg, type) {
    alertEl.className = 'alert ' + type;
    alertEl.innerHTML = (type === 'error' ? '⚠️ ' : '✅ ') + msg;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';
    alertEl.className = 'alert';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res  = await fetch('/api/admin/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('adminData',  JSON.stringify(data.admin));
        showAlert('Login successful! Redirecting...', 'success');
        setTimeout(() => { window.location.href = '/dashboard'; }, 800);
      } else {
        showAlert(data.message || 'Invalid credentials', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Sign In to Admin';
      }
    } catch (err) {
      showAlert('Server error. Please try again.', 'error');
      btn.disabled = false;
      btn.innerHTML = 'Sign In to Admin';
    }
  });
</script>
</body>
</html>
